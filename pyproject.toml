[project]
name = "incident-rank-validation"
version = "1.2.0"
description = "Engine for validating ranked taxonomies against incident corpora."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Rock Lambros" }]
dependencies = [
  "numpy==2.1.3",
  "scipy==1.15.0",
  "numpyro==0.16.1",
  "jax==0.4.35",
  "jaxlib==0.4.35",
  "click==8.1.8",
  "tomli==2.4.1",
  "tomli-w==1.1.0",
  "httpx>=0.27,<1.0",
  "openpyxl>=3.1,<4.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-env==1.1.5",
  "pytest-xdist==3.6.1",
  "mypy==1.13.0",
  "ruff==0.8.4",
  "semgrep==1.168.0",      # bumped from 1.99.0: opentelemetry-proto>=1.37 allows protobuf>=5.29.6 (clears CVE-2026-0994)
  "cyclonedx-bom==7.3.0",  # bumped from 4.6.1: cyclonedx-python-lib>=8 allows lxml>=6.1.0 (clears CVE-2026-41066)
  "setuptools==83.0.0",
]
# Resolved 2026-07-02: the two transitive HIGH CVEs previously deferred here are cleared by the
# cyclonedx-bom and semgrep dev-tool upgrades above — the lock now resolves lxml>=6.1.0
# (CVE-2026-41066, XXE) and protobuf>=5.29.6 (CVE-2026-0994, JSON recursion). Both are dev-only
# tooling deps (SBOM / SAST); neither is imported by the runtime engine.

[project.optional-dependencies]
monitoring = ["wandb>=0.19,<1.0"]
narrative = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.15",
  "kaleido>=1.0",
  "pandas>=2.0",
]
# Notebook execution + markdown export stack for the arXiv preprint build
# (tools/build_preprint.py; see notebooks/preprint/BUILD.md). Previously installed
# by hand, so `uv sync` would silently remove it and break the build — declared
# here so the build environment is tracked and reproducible.
preprint = [
  "nbconvert>=7.16",
  "ipykernel>=6.29",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["engine*"]

[project.scripts]
incident-rank = "engine.cli.main:cli"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# Notebooks are hand-maintained narrative artifacts, not importable library code.
# E402 (imports-not-at-top) is inherent to setup cells that call
# warnings.filterwarnings() before importing noisy libraries; E501 (line length)
# is relaxed for inline HTML/URL strings in the narrative. Engine, tools, and
# tests stay under the full ruleset.
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["engine", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "jax.*", "jaxlib.*", "numpyro.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wandb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "seaborn.*", "plotly.*", "kaleido.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# DO NOT add -m filters here — integration tests must run in CI.
addopts = "-ra -q"
filterwarnings = [
  "error",
  "ignore::FutureWarning:jax",
  "ignore::DeprecationWarning:jax",
  "ignore::FutureWarning:numpyro",
  "ignore:There are not enough devices to run parallel chains:UserWarning",
]
markers = [
  "slow: NUTS / e2e tests",
  "timeout: per-test wall-clock timeout hint (seconds)",
  "integration: real-adapter CLI integration tests (tmp-only, no NUTS)",
]
env = ["JAX_ENABLE_X64=true", "JAX_PLATFORM_NAME=cpu"]
